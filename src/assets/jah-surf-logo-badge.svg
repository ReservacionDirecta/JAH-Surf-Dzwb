<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">JAH SURF Logo</title>
  <desc id="desc">Logo badge cuadrado redondeado con texto JAH SURF en colores rojo, amarillo, verde y azul.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0b1730"/>
    </linearGradient>
    <linearGradient id="surf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="118" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="118" fill="none" stroke="#93c5fd" stroke-opacity="0.35" stroke-width="4"/>

  <g filter="url(#softShadow)">
    <text x="256" y="230" text-anchor="middle" font-size="150" font-weight="900" font-family="Segoe UI, Arial Black, Arial, sans-serif" letter-spacing="-6">
      <tspan fill="#ef4444">J</tspan><tspan fill="#facc15">A</tspan><tspan fill="#22c55e">H</tspan>
    </text>
    <text x="256" y="330" text-anchor="middle" font-size="94" font-weight="900" font-family="Segoe UI, Arial Black, Arial, sans-serif" fill="url(#surf)" letter-spacing="-2">
      SURF
    </text>
  </g>

  <path d="M110 366 C170 342, 228 382, 286 364 C324 352, 356 326, 402 336" fill="none" stroke="#7dd3fc" stroke-opacity="0.85" stroke-width="10" stroke-linecap="round"/>
</svg>
