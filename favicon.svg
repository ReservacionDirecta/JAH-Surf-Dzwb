<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">JAH SURF Logo</title>
  <desc id="desc">Logo circular JAH SURF en fondo oscuro con letras de colores.</desc>
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#222737"/>
      <stop offset="100%" stop-color="#131722"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="228" fill="url(#bg)" filter="url(#softShadow)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#94a3b8" stroke-opacity="0.25" stroke-width="4"/>

  <g font-family="Segoe UI, Arial Black, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="256" y="230" font-size="150" letter-spacing="-6">
      <tspan fill="#ff3b3b">J</tspan><tspan fill="#ffcc00">A</tspan><tspan fill="#00df81">H</tspan>
    </text>
    <text x="256" y="330" font-size="94" fill="#40c4ff" letter-spacing="-2">SURF</text>
  </g>
</svg>
